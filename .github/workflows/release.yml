name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build
        run: |
          npm ci
          npm run build
          cp README.md dist/README.md
      - name: Pack distribution zip
        run: cd dist && zip -r ../FireBlocks-dist.zip .
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: FireBlocks-dist.zip
          generate_release_notes: true