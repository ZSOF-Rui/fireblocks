name = "fireblocks-cloud"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# 一键脚本 setup.mjs 会自动创建 KV 并回填下面的 id
[[kv_namespaces]]
binding = "FB_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# 在线房间中继（WebSocket 直连，每个房间一个 Durable Object）
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 真人匹配队列（全局单例）
[[durable_objects.bindings]]
name = "QUEUE"
class_name = "Queue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Queue"]
